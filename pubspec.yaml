name: acqa
description: "ACQA — aplicativo de gestão de tarefas em Flutter, com autenticação e persistência no Firebase."
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  firebase_core: ^3.1.1
  firebase_auth: ^5.1.1
  # Adicionado na v1.1: antes as tarefas viviam só na memória da tela e
  # sumiam ao fechar o app. A série 5.x é a que casa com firebase_core 3.x.
  cloud_firestore: ^5.0.1
  table_calendar: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
